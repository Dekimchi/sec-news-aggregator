name: CI

on:
  push:
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall -q app tests

      - name: Import sanity check
        run: python -c "from app.main import app; print(app.title)"

      - name: Template readiness check
        run: |
          python - <<'PY'
          from app.main import templates, _READY_TEMPLATES, _READY_FILTERS
          missing = [n for n in _READY_FILTERS if n not in templates.env.filters]
          assert not missing, missing
          for name in _READY_TEMPLATES:
              templates.env.get_template(name)
          print("ready templates ok:", ", ".join(_READY_TEMPLATES))
          PY

      - name: Run tests
        run: PYTHONPATH=. pytest -q

      - name: Bandit security lint
        run: bandit -r app -ll -q

      - name: Dependency audit
        run: pip-audit -r requirements.txt
