name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Production deploys only from master/main — feature branches and PRs never touch the VPS.
    if: >
      (github.event_name == 'workflow_dispatch' &&
       (github.ref_name == 'master' || github.ref_name == 'main')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'master' ||
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CD skipped: set DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy app + reverse proxy over SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          APP_DIR: ${{ secrets.DEPLOY_PATH || '/opt/sec-news-aggregator' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          envs: BRANCH,APP_DIR
          script: |
            set -euo pipefail
            if [ "$BRANCH" != "master" ] && [ "$BRANCH" != "main" ]; then
              echo "Refusing to deploy non-production branch: $BRANCH" >&2
              exit 1
            fi
            cd "$APP_DIR"
            git fetch origin
            # Discard any local drift on the server so pull never blocks CD.
            git checkout -f -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd
            python3 -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            chmod +x deploy/setup-proxy.sh deploy/setup-geo-ru.sh deploy/setup-system-updates.sh
            bash deploy/setup-proxy.sh
            systemctl restart sec-news
            sleep 3
            if ! curl -fsS "http://127.0.0.1:8000/health" | grep -q '"ok":true'; then
              echo "sec-news health check failed" >&2
              systemctl --no-pager -l status sec-news || true
              journalctl -u sec-news -n 80 --no-pager || true
              exit 1
            fi
            if ! systemctl --no-pager --quiet is-active caddy; then
              journalctl -u caddy -n 40 --no-pager || true
              exit 1
            fi
            # App is HTTPS-only; :80 only redirects to TLS.
            curl -fsSk "https://127.0.0.1/health" | grep -q '"ok":true'
            code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/health || true)"
            test "$code" = "301" -o "$code" = "308"
            echo "Deploy + proxy OK"
