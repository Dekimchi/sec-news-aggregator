<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}sec-news{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <a href="/">sec-news</a>
      <span class="tag">practical security</span>
    </div>
    <div class="top-actions">
      <a class="ghost-btn link-btn" href="/updates">История обновлений</a>
      <form method="post" action="/admin/refresh" class="refresh-form js-action"
            data-pending-toast="Обновление ленты… это может занять минуту"
            data-loading-text="Обновление…">
        {% include "partials/csrf.html" %}
        <button type="submit">Обновить сейчас</button>
      </form>
      <form method="post" action="/logout" class="js-action" data-loading-text="Выход…">
        {% include "partials/csrf.html" %}
        <button type="submit" class="ghost-btn">Выйти</button>
      </form>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% include "partials/toast.html" %}
</body>
</html>
