<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}sec-news{% endblock %}</title>
  <link rel="icon" href="/static/branding/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/branding/favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/static/branding/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/static/branding/apple-touch-icon.png">
  <meta name="theme-color" content="#0c1210">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body {% block body_attrs %}{% endblock %}>
  <div id="refresh-progress" class="refresh-progress" hidden aria-hidden="true">
    <div class="refresh-progress-bar"></div>
  </div>

  <header class="shell-top">
    <div class="shell-top-inner">
      <div class="shell-left">
        <div class="nav-menu" data-dropdown data-dropdown-id="sections">
          <button type="button" class="icon-btn nav-menu-btn" data-dropdown-toggle
                  aria-expanded="false" aria-controls="sections-panel" aria-label="Разделы">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h10" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="nav-popover" id="sections-panel" data-dropdown-panel hidden>
            <p class="nav-popover-label">Разделы</p>
            <a class="nav-popover-link {% if active_nav == 'feed' %}is-active{% endif %}" href="/" data-nav="feed">Лента</a>
            <a class="nav-popover-link {% if active_nav == 'bookmarks' %}is-active{% endif %}" href="/?bookmarks=1" data-nav="bookmarks">Закладки</a>
          </div>
        </div>
      </div>

      <div class="brand brand--center">
        <a href="/" class="brand-link" data-nav="feed" aria-label="sec-news — на главную">
          <img class="brand-logo" src="/static/branding/logo-mark.png" width="36" height="36" alt="">
          <span class="brand-mark">sec-news</span>
        </a>
      </div>

      <div class="shell-right">
        {% if active_nav == 'feed' %}
        <form method="post" action="/admin/refresh" class="refresh-form js-action"
              data-refresh-progress
              data-pending-toast="Обновление ленты…"
              data-loading-text="">
          {% include "partials/csrf.html" %}
          <input type="hidden" name="next" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
          <button type="submit" class="icon-btn refresh-btn" aria-label="Обновить ленту" title="Обновить">
            <svg class="refresh-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.2-5.5" stroke-linecap="round"/>
              <path d="M20 4v5h-5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
        {% endif %}

        <div class="nav-menu" data-dropdown data-dropdown-id="settings">
          <button type="button" class="icon-btn nav-menu-btn" data-dropdown-toggle
                  aria-expanded="false" aria-controls="settings-panel" aria-label="Настройки">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="nav-popover nav-popover--right" id="settings-panel" data-dropdown-panel hidden>
            <p class="nav-popover-label">Настройки</p>
            <a class="nav-popover-link {% if active_nav == 'dashboard' %}is-active{% endif %}" href="/dashboard">Дашборд</a>
            <form method="post" action="/logout" class="js-action nav-popover-form" data-loading-text="Выход…">
              {% include "partials/csrf.html" %}
              <button type="submit" class="nav-popover-link nav-popover-btn">Выйти</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="shell-main {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/toast.html" %}
  <script src="/static/toast.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
