<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}sec-news{% endblock %}</title>
  <link rel="icon" href="/static/branding/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/branding/favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/static/branding/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/static/branding/apple-touch-icon.png">
  <meta name="theme-color" content="#0c1210">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body {% block body_attrs %}{% endblock %}>
  <header class="shell-top">
    <div class="shell-top-inner">
      <div class="brand">
        <a href="/" class="brand-link" data-nav="feed" aria-label="sec-news — на главную">
          <img class="brand-logo" src="/static/branding/logo-mark.png" width="36" height="36" alt="">
          <span class="brand-mark">sec-news</span>
        </a>
        <span class="brand-tag">practical security</span>
      </div>

      <nav class="tabs" aria-label="Разделы">
        <a class="tab {% if active_nav == 'feed' %}is-active{% endif %}" href="/" data-nav="feed">Лента</a>
        <a class="tab {% if active_nav == 'bookmarks' %}is-active{% endif %}" href="/?bookmarks=1" data-nav="bookmarks">Закладки</a>
        <a class="tab {% if active_nav == 'dashboard' %}is-active{% endif %}" href="/dashboard" data-nav="dashboard">Дашборд</a>
      </nav>

      <button type="button" class="icon-btn mobile-only" id="menu-toggle" aria-expanded="false" aria-controls="top-actions" aria-label="Меню">
        <span></span><span></span>
      </button>

      <div class="top-actions" id="top-actions">
        <form method="post" action="/admin/refresh" class="refresh-form js-action"
              data-pending-toast="Обновление ленты… это может занять минуту"
              data-loading-text="Обновление…">
          {% include "partials/csrf.html" %}
          <button type="submit" class="btn btn-accent">Обновить</button>
        </form>
        <form method="post" action="/logout" class="js-action" data-loading-text="Выход…">
          {% include "partials/csrf.html" %}
          <button type="submit" class="btn btn-ghost">Выйти</button>
        </form>
      </div>
    </div>
  </header>

  <main class="shell-main {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/toast.html" %}
  <script src="/static/toast.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
